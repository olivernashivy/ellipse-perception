<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="bottomUpGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd93d;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffd93d;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="topDownGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6bcb77;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#6bcb77;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="128"/>
  
  <!-- Bottom-Up Ellipse (Horizontal - Yellow) -->
  <ellipse cx="256" cy="256" rx="180" ry="80" fill="url(#bottomUpGrad)" stroke="#ffd93d" stroke-width="4" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Top-Down Ellipse (Vertical - Green) -->
  <ellipse cx="256" cy="256" rx="80" ry="180" fill="url(#topDownGrad)" stroke="#6bcb77" stroke-width="4" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Center dot -->
  <circle cx="256" cy="256" r="12" fill="white" opacity="0.8" filter="url(#glow)"/>
</svg>
